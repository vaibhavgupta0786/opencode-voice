version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    ignore:
      # @opentui/solid pins solid-js exactly; single-version bumps of the
      # @opentui pair must move together (tracked by hand, see README).
      - dependency-name: "@opentui/*"
      # the @opencode SDK peers pin exact sibling versions per release
      - dependency-name: "@opencode/*"
      # @opentui/solid@0.5.x peers solid-js EXACTLY (1.9.12) — any other
      # version is unresolvable in fresh installs; it only moves when the
      # @opentui pair moves (see README manifest note)
      - dependency-name: solid-js
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
